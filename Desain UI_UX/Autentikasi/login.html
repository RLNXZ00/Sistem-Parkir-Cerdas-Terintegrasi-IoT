<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SPGE System - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>body { min-height: 100dvh; }</style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed": "#2c1600",
                        "on-tertiary-container": "#653a00",
                        "surface-tint": "#7ad0ff",
                        "primary-fixed-dim": "#7ad0ff",
                        "secondary": "#7ed99e",
                        "on-primary-container": "#004a65",
                        "background": "#0e1418",
                        "surface-container-high": "#252b2f",
                        "tertiary": "#ffc184",
                        "inverse-surface": "#dee3e8",
                        "inverse-on-surface": "#2b3135",
                        "on-surface": "#dee3e8",
                        "outline-variant": "#3d4850",
                        "secondary-fixed": "#9af6b8",
                        "surface-bright": "#343a3e",
                        "inverse-primary": "#00668a",
                        "text-muted": "#9E9E9E",
                        "primary": "#8fd6ff",
                        "on-error": "#690005",
                        "surface-container-low": "#161c20",
                        "secondary-container": "#00703f",
                        "on-primary": "#003549",
                        "error": "#ffb4ab",
                        "system-info": "#00BFFF",
                        "surface-container": "#1a2024",
                        "on-secondary-fixed": "#00210f",
                        "on-primary-fixed": "#001e2c",
                        "on-tertiary": "#492900",
                        "surface-container-lowest": "#090f13",
                        "on-tertiary-fixed-variant": "#693c00",
                        "on-secondary": "#00391d",
                        "on-surface-variant": "#bcc8d1",
                        "on-error-container": "#ffdad6",
                        "secondary-fixed-dim": "#7ed99e",
                        "on-secondary-container": "#94f0b2",
                        "on-primary-fixed-variant": "#004c69",
                        "surface-variant": "#30363a",
                        "outline": "#87929b",
                        "on-secondary-fixed-variant": "#00522d",
                        "slot-empty": "#333333",
                        "warning-reserved": "#FFD700",
                        "primary-container": "#00bfff",
                        "tertiary-container": "#fb9c24",
                        "primary-fixed": "#c3e8ff",
                        "tertiary-fixed-dim": "#ffb86e",
                        "surface-dim": "#0e1418",
                        "surface-container-highest": "#30363a",
                        "bg-primary": "#121212",
                        "eco-success": "#2E8B57",
                        "surface": "#0e1418",
                        "text-high-contrast": "#FFFFFF",
                        "bg-surface": "#1E1E1E",
                        "tertiary-fixed": "#ffdcbd",
                        "error-container": "#93000a",
                        "on-background": "#dee3e8",
                        "alert-anomaly": "#FF4500"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "card-padding": "20px",
                        "gutter": "16px",
                        "container-margin": "24px",
                        "unit": "4px"
                    },
                    "fontFamily": {
                        "display-lg": ["Inter", "sans-serif"],
                        "terminal-status": ["Inter", "sans-serif"],
                        "headline-md": ["Inter", "sans-serif"],
                        "tech-mono": ["Space Grotesk", "monospace"],
                        "body-base": ["Inter", "sans-serif"]
                    },
                    "fontSize": {
                        "display-lg": ["48px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "terminal-status": ["32px", { "lineHeight": "1.1", "fontWeight": "800" }],
                        "headline-md": ["24px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "tech-mono": ["18px", { "lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "body-base": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-bg-primary text-on-surface font-body-base flex items-center justify-center relative overflow-hidden min-h-[100dvh] min-h-\[100dvh\]">
<!-- Login Card Container -->
<div class="w-full max-w-[450px] p-container-margin">
<div class="bg-[#161c22] border border-[#2b3540] rounded-xl shadow-2xl p-card-padding flex flex-col gap-6">
<!-- Header -->
<div class="text-center flex flex-col gap-unit items-center">
<span class="material-symbols-outlined text-display-lg text-primary mb-2" data-weight="fill" style="font-variation-settings: 'FILL' 1;">eco</span>
<h1 class="font-headline-md text-headline-md text-text-high-contrast tracking-tight">Smart Parking</h1>
<p class="font-tech-mono text-tech-mono text-system-info uppercase text-sm tracking-wider">Green-IoT Integrated</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-5 mt-4">
<!-- Role Selector -->
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-on-surface-variant uppercase tracking-wider" for="role">Access Role</label>
<div class="relative">
<select class="w-full bg-[#0e1418] border border-[#2b3540] rounded-lg px-4 py-3 text-on-surface focus:outline-none focus:border-system-info focus:ring-1 focus:ring-system-info appearance-none font-body-base transition-colors duration-200" id="role">
<option value="management">Management</option>
<option value="field">Field Staff</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">arrow_drop_down</span>
</div>
</div>
<!-- Username -->
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-on-surface-variant uppercase tracking-wider" for="username">Username</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">person</span>
<input class="w-full bg-[#0e1418] border border-[#2b3540] rounded-lg pl-10 pr-4 py-3 text-on-surface placeholder-text-muted focus:outline-none focus:border-system-info focus:ring-1 focus:ring-system-info font-tech-mono text-base transition-colors duration-200" id="username" placeholder="Enter credentials" type="text"/>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="text-sm font-semibold text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<a class="text-sm text-system-info hover:text-primary transition-colors font-semibold" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
<input class="w-full bg-[#0e1418] border border-[#2b3540] rounded-lg pl-10 pr-10 py-3 text-on-surface placeholder-text-muted focus:outline-none focus:border-system-info focus:ring-1 focus:ring-system-info font-tech-mono text-base transition-colors duration-200" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Action Button -->
<button class="mt-4 w-full bg-[#ea580c] hover:bg-[#c2410c] text-white font-headline-md font-semibold text-lg py-4 rounded-lg flex items-center justify-center gap-2 transition-all duration-200 shadow-lg shadow-orange-950/30 active:scale-[0.99]" type="submit">
<span class="material-symbols-outlined">login</span>
                    Sign In
                </button>
<!-- System Status Indicator -->
<div class="mt-2 flex items-center justify-center gap-2 text-sm text-on-surface-variant font-tech-mono">
<span class="w-2 h-2 rounded-full bg-eco-success animate-pulse shadow-[0_0_8px_rgba(46,139,87,0.8)]"></span>
                    System Online
                </div>
</form>
</div>
</div>
</body></html>
