<body class="bg-bg-primary text-text-high-contrast min-h-screen flex flex-col items-center justify-center relative overflow-hidden bg-pattern">
<!-- Background Decoration -->
<!-- Main Container -->

<!-- Top Indicator -->

</div>
<!-- Central Status -->
<div class="flex flex-col items-center justify-center mb-12 text-center"><span class="material-symbols-outlined text-eco-success mb-4" style='font-size: 80px; font-variation-settings: "FILL" 1;'>check_circle</span>
<h1 class="font-display-lg text-[64px] font-extrabold leading-tight tracking-tight uppercase glow-success text-eco-success" style="text-shadow: 0 0 15px rgba(46, 139, 87, 0.4);">LUNAS</h1>
<p class="font-display-lg text-2xl font-medium tracking-widest mt-2 uppercase text-white">Silakan Jalan</p></div>
<!-- Details Card -->
<div class="w-full space-y-4 max-w-[540px]">
<div class="bg-surface-container-high border border-outline-variant rounded-xl p-6 flex flex-col items-center py-10">
<p class="font-tech-mono text-sm text-on-surface-variant mb-3 uppercase tracking-widest">Detected Plate</p>
<div class="bg-background-dark border-2 border-eco-success/30 rounded-lg px-8 py-4 px-12 py-6 border-eco-success/50">

</div>
</div>

<span class="font-tech-mono text-xl font-bold text-text-high-contrast tracking-wider text-2xl" id="current-time">04:31:54</span>
</div>
</div>
<!-- Footer -->
<div class="absolute bottom-8 flex items-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined text-system-info" style="font-size: 18px;">cloud_done</span>
<span class="font-tech-mono text-tech-mono text-sm tracking-widest opacity-80">SISTEM ONLINE</span>
</div>
</main>
<script>
        // Real-time clock for the details card
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-US', { hour12: false });
            const timeElement = document.getElementById('current-time');
            if (timeElement) {
                timeElement.textContent = timeString;
            }
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>
