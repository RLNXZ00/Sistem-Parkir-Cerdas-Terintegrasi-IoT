<!DOCTYPE html><html class="dark" lang="id"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Visitor Terminal Display</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

                        "surface-tint": "#7ad0ff",

                        "secondary-container": "#00703f",
                        "inverse-primary": "#00668a",
                        "tertiary-container": "#fb9c24",
                        "surface-container": "#1a2024",
                        "outline": "#87929b",
                        "surface-dim": "#0e1418",
                        "on-primary-fixed": "#001e2c",

                    "spacing": {
                        "gutter": "16px",

                        "container-margin": "24px"

                    "fontFamily": {
                        "tech-mono": ["Space Grotesk", "monospace"],

<style>
        .terminal-glow {
            text-shadow: 0 0 20px rgba(46, 139, 87, 0.6);
        }
        .text-huge {
            font-size: 8rem;
            line-height: 1;
            font-weight: 800;
            letter-spacing: -0.02em;
        }
    </style>
</head>
<body class="bg-surface h-screen w-screen overflow-hidden flex items-center justify-center font-body-base text-body-base text-on-surface">
<main class="flex flex-col items-center justify-center text-center space-y-12 p-container-margin w-full max-w-7xl mx-auto">
<!-- Top Status -->
<div class="text-text-muted font-tech-mono text-tech-mono uppercase tracking-widest opacity-80">
            MENDAPATKAN SLOT...
        </div>
<!-- Center Main Display -->
<div class="flex flex-col items-center justify-center space-y-6">
<h1 class="text-huge font-terminal-status text-eco-success terminal-glow">
                B1-10
            </h1>
<h2 class="font-headline-md text-headline-md text-text-high-contrast tracking-wide uppercase">
                SLOT PARKIR ANDA
            </h2>
</div>
<!-- Sub Info -->
<div class="bg-surface-container-high px-8 py-4 rounded-xl border border-outline-variant shadow-lg backdrop-blur-sm">
<p class="font-tech-mono text-tech-mono text-system-info">
                ID Parkir: 021
            </p>
</div>
<!-- Bottom Loading -->
<div class="flex items-center space-x-3 text-on-surface-variant font-tech-mono text-sm mt-16 opacity-70">
<span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 0;">
                sync
            </span>
<span>Menyiapkan rute navigasi...</span>
</div>
</main>
