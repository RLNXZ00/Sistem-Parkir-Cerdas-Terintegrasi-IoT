<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Exit Gate Display - Failure</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

            darkMode: "class",

                    "colors": {
                        "secondary-fixed": "#9af6b8",

                        "on-tertiary-fixed-variant": "#693c00",
                        "text-muted": "#9E9E9E",
                        "bg-surface": "#1E1E1E",
                        "surface-variant": "#30363a",
                        "system-info": "#00BFFF",
                        "on-tertiary": "#492900",
                        "tertiary-container": "#fb9c24",
                        "text-high-contrast": "#FFFFFF",

                        "surface": "#0e1418",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "gutter": "16px",

<style>
        .glass-panel {
            background: rgba(30, 30, 30, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 69, 0, 0.2);
        }
        .glow-red {
            box-shadow: 0 0 40px rgba(255, 69, 0, 0.4);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-bg-primary text-on-surface h-screen w-screen overflow-hidden flex flex-col items-center justify-center relative">
<!-- TopAppBar equivalent for Terminal -->

<!-- Main Content Area -->
<main class="w-full max-w-5xl mx-auto flex flex-col items-center justify-center gap-12 mt-24 px-container-margin z-10 relative">
<!-- Large Warning Icon -->
<div class="relative">
<div class="absolute inset-0 bg-alert-anomaly opacity-20 blur-3xl rounded-full scale-150 animate-pulse"></div>
<span class="material-symbols-outlined text-[120px] text-alert-anomaly relative z-10" style="font-variation-settings: 'FILL' 1;">error</span>
</div>
<!-- Typography: Main Error State -->
<div class="text-center flex flex-col gap-4">
<h2 class="font-display-lg text-display-lg text-alert-anomaly animate-pulse-fast uppercase tracking-widest drop-shadow-[0_0_15px_rgba(255,69,0,0.8)]">
                SALDO KURANG
            </h2>
<p class="font-headline-md text-headline-md text-text-high-contrast opacity-90 max-w-2xl mx-auto leading-relaxed">
                Mohon lakukan pengisian saldo atau gunakan kartu lain
            </p>
</div>
<!-- Details Card -->
<div class="glass-panel glow-red rounded-xl p-8 w-full max-w-xl flex flex-col items-center gap-6 mt-8">
<span class="font-body-base text-body-base text-text-muted uppercase tracking-wider font-tech-mono">Detected License Plate</span>
<div class="rounded-lg px-8 flex items-center justify-center w-full bg-on-surface/5 border-on-surface/10 py-6">
<span class="font-tech-mono text-[40px] font-bold tracking-[0.2em] text-text-high-contrast">
                    AB 1234 CD
                </span>
</div>
<!-- Quick Actions -->
<div class="flex w-full gap-4 mt-4">
<button class="flex-1 hover:bg-surface-bright text-on-surface font-body-base text-body-base py-4 rounded-lg transition-colors border border-outline-variant flex items-center justify-center gap-2 bg-white/10"><span class="material-symbols-outlined">refresh</span><span class="font-tech-mono uppercase tracking-widest">RETRY CARD</span></button>
<button class="flex-1 bg-alert-anomaly/20 hover:bg-alert-anomaly/30 text-alert-anomaly font-body-base text-body-base py-4 rounded-lg transition-colors border border-alert-anomaly flex items-center justify-center gap-2"><span class="material-symbols-outlined">support_agent</span><span class="font-tech-mono uppercase tracking-widest">CALL ASSISTANCE</span></button>
</div>
</div>
</main>
<!-- Decorative Background Elements -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-10" style="background-image: radial-gradient(circle at center, rgba(255, 69, 0, 0.3) 0%, transparent 70%);"></div>
<div class="absolute inset-0 z-0 pointer-events-none" style="background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.1) 2px, rgba(0,0,0,0.1) 4px);"></div>
<!-- Footer BottomNavBar equivalent -->
<div class="absolute bottom-8 flex items-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined text-system-info" style="font-size: 18px;">cloud_done</span>
<span class="font-tech-mono text-tech-mono text-sm tracking-widest opacity-80">SISTEM ONLINE</span>
</div>






</body></html>
