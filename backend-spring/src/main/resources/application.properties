# ===================================================================
# KONFIGURASI APLIKASI SPRING BOOT SPCT IOT
# ===================================================================

# Port server (ubah ke 8081 karena 8080 dibajak oleh Oracle Database)
server.port=8081

# ===================================================================
# KONFIGURASI DATABASE (PostgreSQL)
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/db_spct_iot
spring.datasource.username=postgres
spring.datasource.password=postgres

# Driver Database
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# KONFIGURASI JPA & HIBERNATE (ORM)
# ===================================================================
# update: akan otomatis membuat/memperbarui struktur tabel berdasarkan anotasi @Entity di Java
spring.jpa.hibernate.ddl-auto=update

# Tampilkan SQL di terminal (berguna untuk melihat kueri apa yang dieksekusi Spring)
spring.jpa.show-sql=true

# Format log SQL agar rapi dan mudah dibaca
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# KONFIGURASI KEBIJAKAN RETENSI DATA (DATA RETENTION POLICY - FASE 7)
# ===================================================================
# Batas retensi log IoT rutin/normal dalam satuan hari (default: 90 hari)
spct.retensi.log-iot-hari=90

# Status aktifasi otomatis cron pembersihan data (true: aktif, false: non-aktif)
spct.retensi.purge-enabled=true

# Ekspresi Cron untuk eksekusi pembersihan harian (default: setiap jam 02:00 dini hari)
# Format: detik menit jam hari-bulan bulan hari-minggu
spct.retensi.purge-cron=0 0 2 * * ?
