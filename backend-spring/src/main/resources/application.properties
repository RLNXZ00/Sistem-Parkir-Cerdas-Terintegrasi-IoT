# ===================================================================
# KONFIGURASI APLIKASI SPRING BOOT SPCT IOT
# ===================================================================

# Port server (default 8080)
server.port=8080

# ===================================================================
# KONFIGURASI DATABASE (PostgreSQL)
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/db_spct_iot
spring.datasource.username=postgres
spring.datasource.password=password

# Driver Database
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# KONFIGURASI JPA & HIBERNATE (ORM)
# ===================================================================
# update: akan otomatis membuat/memperbarui struktur tabel berdasarkan anotasi @Entity di Java
spring.jpa.hibernate.ddl-auto=update

# Tampilkan SQL di terminal (berguna untuk melihat kueri apa yang dieksekusi Spring)
spring.jpa.show-sql=true

# Format log SQL agar rapi dan mudah dibaca
spring.jpa.properties.hibernate.format_sql=true
